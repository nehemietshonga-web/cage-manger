<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c111a">
<meta name="description" content="Cage Manager : collectionne des combattants de MMA, monte ton équipe et deviens champion.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cage Manager">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cage Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Concept : affiche de soirée de combat. Coin rouge (toi) contre coin bleu (adversaire), cartes à pans coupés comme l'octogone. */
:root{
  --bg:#efeadf; --card:#fbf8f1; --surface:#f7f3ea; --surface2:#e4ddcd; --fg:#161a21; --muted:#5d6572; --line:#cfc7b5;
  --red:#c42f1c; --red-ink:#fff; --blue:#2559b8; --gold:#a97c12; --good:#2b8553; --bad:#b3261e;
  --r0:#7c8795; --r1:#2f6fd6; --r2:#8a3fd0; --r3:#c8920f; --r4:#d4224f;
  --font-d:'Big Shoulders Display','Impact','Arial Narrow',sans-serif;
  --font-b:'Barlow','Helvetica Neue',Arial,sans-serif;
  --cut:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c111a; --card:#161e2c; --surface:#131a27; --surface2:#1e2839; --fg:#ece7db; --muted:#929bab; --line:#2a3548;
  --red:#ec4a35; --blue:#5d92f2; --gold:#e5b64b; --good:#49b47a; --bad:#f2675c;
  --r0:#8e9aaa; --r1:#4d8cf0; --r2:#a665ee; --r3:#eab13a; --r4:#ff4d7e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c111a; --card:#161e2c; --surface:#131a27; --surface2:#1e2839; --fg:#ece7db; --muted:#929bab; --line:#2a3548;
  --red:#ec4a35; --blue:#5d92f2; --gold:#e5b64b; --good:#49b47a; --bad:#f2675c;
  --r0:#8e9aaa; --r1:#4d8cf0; --r2:#a665ee; --r3:#eab13a; --r4:#ff4d7e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.4;padding-inline:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding-bottom:104px}
h1,h2,h3{font-family:var(--font-d);font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1}
h2{font-size:30px}
.muted{color:var(--muted)}
.tab{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:900;font-size:24px;letter-spacing:.06em;line-height:1}
.brand b{color:var(--red);font-weight:900}
.brand svg{width:26px;height:26px;flex:none}
.wallet{display:flex;align-items:center;gap:12px;font-weight:700;font-variant-numeric:tabular-nums}
.wallet span{display:inline-flex;align-items:center;gap:5px}
.wallet svg{width:17px;height:17px}
.icon-btn{background:none;border:0;padding:6px;border-radius:8px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;fill:currentColor}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);position:relative}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--red)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--red)}

main{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h p{margin:0;font-size:14px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border:0;background:var(--red);color:var(--red-ink);font-family:var(--font-d);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.btn.alt{background:var(--surface2);color:var(--fg)}
.btn.blue{background:var(--blue);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 16px;font-size:16px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* cards */
.card{--rc:var(--r0);container-type:inline-size;position:relative;display:block;width:100%;aspect-ratio:3/4.15;padding:2px;border:0;background:var(--rc);text-align:left;
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut))}
.card.r1{--rc:var(--r1)}.card.r2{--rc:var(--r2)}.card.r3{--rc:var(--r3)}
.card-in{position:absolute;inset:2px;overflow:hidden;background:var(--card);
  background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 30%,var(--card)) 0%,var(--card) 62%);
  clip-path:polygon(calc(var(--cut) - 2px) 0,calc(100% - var(--cut) + 2px) 0,100% calc(var(--cut) - 2px),100% calc(100% - var(--cut) + 2px),calc(100% - var(--cut) + 2px) 100%,calc(var(--cut) - 2px) 100%,0 calc(100% - var(--cut) + 2px),0 calc(var(--cut) - 2px))}
.card.r3 .card-in::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,236,170,.28) 50%,transparent 65%);background-size:250% 100%;animation:foil 5s linear infinite;pointer-events:none}
@keyframes foil{from{background-position:130% 0}to{background-position:-130% 0}}
.c-ovr{position:absolute;left:7cqw;top:4cqw;font-family:var(--font-d);font-weight:900;font-size:19cqw;line-height:.85;color:var(--rc);font-variant-numeric:tabular-nums}
.c-sty{position:absolute;left:7.5cqw;top:22cqw;font-size:max(9px,5.2cqw);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.c-meta{position:absolute;right:7cqw;top:6cqw;text-align:right;font-size:max(9px,5.4cqw);font-weight:700;letter-spacing:.08em;color:var(--muted);line-height:1.5}
.c-art{position:absolute;left:0;right:0;top:12cqw;bottom:50cqw}
.c-art svg{width:100%;height:100%;display:block}
.c-id{position:absolute;left:6cqw;right:6cqw;bottom:22cqw}
.c-first{font-size:max(9px,5.4cqw);color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-last{font-family:var(--font-d);font-weight:900;font-size:11.5cqw;text-transform:uppercase;letter-spacing:.02em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-nick{font-size:max(9px,5.2cqw);color:var(--rc);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.c-stats{position:absolute;left:4cqw;right:4cqw;bottom:3cqw;height:16cqw;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid color-mix(in srgb,var(--rc) 50%,transparent);padding-top:1.5cqw}
.c-stats div{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.c-stats b{font-family:var(--font-d);font-weight:800;font-size:8cqw;font-variant-numeric:tabular-nums}
.c-stats i{font-style:normal;font-size:max(8px,4.2cqw);font-weight:700;letter-spacing:.06em;color:var(--muted)}
.c-stats .pri b{color:var(--rc)}
.c-badge{position:absolute;left:50%;top:3cqw;transform:translateX(-50%);background:var(--rc);color:#fff;font-size:max(9px,5cqw);font-weight:800;letter-spacing:.08em;padding:1cqw 4cqw;white-space:nowrap}
.card.locked .card-in{background:var(--surface2)}
.card.locked{--rc:var(--line)}
.c-lock{position:absolute;inset:0 0 30cqw;display:grid;place-items:center;font-family:var(--font-d);font-weight:900;font-size:40cqw;color:var(--line)}
.card.owned-team::before{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--red);z-index:2}
button.card:active{transform:scale(.98)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:14px}

/* fight bills */
.bill{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red)}
.bill.lock{border-left-color:var(--line);opacity:.7}
.bill-n{font-family:var(--font-d);font-weight:900;font-size:54px;line-height:.9;color:var(--red);text-align:center;font-variant-numeric:tabular-nums}
.bill.lock .bill-n{color:var(--muted)}
.bill h3{font-size:24px}
.bill small{display:block;color:var(--muted);margin-top:3px}
.bill-m{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;font-weight:600}
.stars{display:inline-flex;gap:2px}
.stars svg{width:15px;height:15px}
.st-on{fill:var(--gold)}.st-off{fill:var(--surface2)}
@media (max-width:480px){.bill{grid-template-columns:48px 1fr}.bill .btn{grid-column:1/-1}.bill-n{font-size:42px}}

.panel{background:var(--card);border:1px solid var(--line);padding:14px 16px}
.hint{border-left:4px solid var(--blue);background:var(--surface);padding:12px 14px;font-size:14px}
.hint b{font-weight:700}
.triangle{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;background:var(--surface2);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.chip.f{background:color-mix(in srgb,var(--red) 18%,var(--surface2))}
.chip.l{background:color-mix(in srgb,var(--blue) 18%,var(--surface2))}
.chip.s{background:color-mix(in srgb,var(--gold) 22%,var(--surface2))}
.chip.on{background:var(--fg);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
button.chip{border:0}

/* rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--line);text-align:left}
button.row:hover{border-color:var(--muted)}
.slot-n{font-family:var(--font-d);font-weight:800;font-size:14px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.mini{display:flex;align-items:center;gap:10px;min-width:0}
.mini-av{width:46px;height:46px;flex:none;background:var(--surface2);overflow:hidden;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.mini-av svg{width:100%;height:100%;display:block}
.mini-t{min-width:0}
.mini-t b{display:block;font-family:var(--font-d);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-t span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.ovr{font-family:var(--font-d);font-weight:900;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.ovr.r0{color:var(--r0)}.ovr.r1{color:var(--r1)}.ovr.r2{color:var(--r2)}.ovr.r3{color:var(--r3)}
.power{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.power b{font-family:var(--font-d);font-weight:900;font-size:44px;line-height:1}
.bar{display:flex;height:10px;background:var(--surface2);overflow:hidden;min-width:120px;flex:1}
.bar i{display:block;height:100%}

/* prep */
.bout-row{display:grid;grid-template-columns:1fr 54px 1fr;gap:8px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line)}
.bout-row .mini-t b{font-size:18px}
.bout-row .side-b{text-align:right;flex-direction:row-reverse}
.bout-row button{background:none;border:0;padding:0;text-align:left}
.vsx{text-align:center;font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:.06em;color:var(--muted);line-height:1.1}
.vsx small{display:block;font-family:var(--font-b);font-size:10px;font-weight:700;letter-spacing:.06em}
.adv-a{color:var(--red)}.adv-b{color:var(--blue)}
.me-tag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}

/* fight screen */
.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}
.fbar .strip{display:flex;gap:5px}
.fbar .strip i{width:22px;height:8px;background:var(--surface2)}
.strip i.w{background:var(--good)}.strip i.l{background:var(--bad)}.strip i.cur{background:var(--gold)}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.fp{display:flex;flex-direction:column;gap:8px;min-width:0}
.fp-av{aspect-ratio:1;background:var(--surface2);border:3px solid var(--red);overflow:hidden;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
.fp.blue .fp-av{border-color:var(--blue)}
.fp-av svg{width:100%;height:100%;display:block}
.fp h3{font-size:24px;line-height:.95;overflow-wrap:anywhere}
.fp .sub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fp.blue{text-align:right}
.hp{height:12px;background:var(--surface2);overflow:hidden}
.hp i{display:block;height:100%;background:var(--red);transition:width .5s ease}
.fp.blue .hp i{background:var(--blue);margin-left:auto}
.hpn{font-family:var(--font-d);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.hud{text-align:center;padding-top:8px;min-width:64px}
.hud b{display:block;font-family:var(--font-d);font-weight:900;font-size:22px;line-height:1}
.hud span{font-family:var(--font-d);font-weight:800;font-size:30px;color:var(--muted)}
.hud em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0;height:min(34vh,280px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:50px 1fr;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.log li time{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.log li.round{display:block;background:var(--surface2);font-family:var(--font-d);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.log li.sa{box-shadow:inset 4px 0 var(--red)}.log li.sb{box-shadow:inset 4px 0 var(--blue)}
.log li.end{font-weight:700;background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.verdict{padding:16px;border:2px solid var(--line);background:var(--card)}
.verdict h3{font-size:34px}
.verdict.win{border-color:var(--good)}.verdict.win h3{color:var(--good)}
.verdict.loss{border-color:var(--bad)}.verdict.loss h3{color:var(--bad)}
.verdict p{margin:6px 0 0;color:var(--muted);font-size:14px}
.ctrls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big-result{text-align:center;padding:26px 16px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:10px}
.big-result h1{font-size:64px}
.big-result.win{border-color:var(--good)}.big-result.win h1{color:var(--good)}
.big-result.loss{border-color:var(--bad)}.big-result.loss h1{color:var(--bad)}
.big-result .score{font-family:var(--font-d);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.gain{display:flex;flex-direction:column;gap:4px;font-weight:600}
.stars.lg svg{width:30px;height:30px}

/* combat : scène */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.sc-side.b{text-align:right}
.sc-name{font-family:var(--font-d);font-weight:900;font-size:30px;line-height:.95;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.sc-sub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.hpw{position:relative;height:14px;margin-top:8px;background:var(--surface2);overflow:hidden;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.sc-side.b .hpw{clip-path:polygon(9px 0,100% 0,100% 100%,0 100%)}
.hpw i{position:absolute;top:0;bottom:0;left:0;width:100%}
.sc-side.b .hpw i{left:auto;right:0}
.hpw .trail{background:#fff;opacity:.8;transition:width .9s ease .45s}
.hpw .hpf{background:var(--red);transition:width .35s ease}
.sc-side.b .hpf{background:var(--blue)}
.hpw.low .hpf{animation:lowhp .6s ease-in-out infinite alternate}
@keyframes lowhp{from{opacity:1}to{opacity:.5}}
.sc-mid{text-align:center;min-width:76px}
.sc-r{font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:.1em;color:var(--muted);line-height:1}
.sc-t{font-family:var(--font-d);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.stage{position:relative;aspect-ratio:16/10;overflow:hidden;isolation:isolate;background:#090d15;color:#fff;
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
.stage .floor{position:absolute;inset:0;width:100%;height:100%;display:block}
.fig{position:absolute;bottom:3%;width:41%;transition:transform .7s ease,filter .6s ease;z-index:2}
.fig.a{left:5%}.fig.b{right:5%}
.fig .bob{animation:bob 1.7s ease-in-out infinite alternate}
.fig.b .bob{animation-delay:-.8s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.4%)}}
.fig .fa svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.fig.b .fa{transform:scaleX(-1)}
.fig.win{filter:drop-shadow(0 0 14px rgba(240,190,70,.75))}
.fig.lose{filter:grayscale(.75) brightness(.7)}
.fig.lose .bob{animation:none}
.fig.ko.a{transform:translate(-8%,30%) rotate(-28deg)}
.fig.ko.b{transform:translate(8%,30%) rotate(28deg)}
.fx{position:absolute;inset:0;z-index:4;pointer-events:none}
.hit{position:absolute;width:21%;aspect-ratio:1;background:radial-gradient(circle,#fff 0 14%,#ffd34d 15% 36%,#ff6a2b 37% 56%,transparent 58%);
  clip-path:polygon(50% 0,61% 33%,96% 20%,72% 50%,100% 72%,64% 68%,60% 100%,46% 72%,12% 92%,28% 58%,0 40%,34% 36%)}
.dmg{position:absolute;font-family:var(--font-d);font-weight:900;font-size:clamp(26px,7vw,44px);line-height:1;color:#fff;-webkit-text-stroke:2px #b3261e;paint-order:stroke fill;text-shadow:0 2px 8px rgba(0,0,0,.6);transform:translate(-50%,0)}
.dmg.sm{font-size:clamp(18px,4.6vw,28px);-webkit-text-stroke:1.5px #6b2a25}
.tag{position:absolute;padding:2px 12px;font-family:var(--font-d);font-weight:800;font-size:clamp(14px,3.6vw,20px);letter-spacing:.14em;text-transform:uppercase;color:#fff;transform:translate(-50%,0)}
.tag.ta{background:var(--red)}.tag.tb{background:var(--blue)}
.flash{position:absolute;inset:0;background:#fff}
.banner,.stamp{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;opacity:0;font-family:var(--font-d);font-weight:900;text-transform:uppercase;white-space:nowrap}
.banner{top:34%;font-size:clamp(34px,10vw,64px);letter-spacing:.14em;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.stamp{top:42%;font-size:clamp(46px,14vw,92px);line-height:1;padding:0 .18em;border:.07em solid currentColor;background:rgba(5,8,14,.55);letter-spacing:.04em;transition:opacity .3s}
.stamp.ko{color:#ff5a45}.stamp.amber{color:#ffc247}.stamp.dec{color:#9ec2ff;font-size:clamp(34px,10vw,64px)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:30px 16px 10px;background:linear-gradient(to top,rgba(5,8,14,.94),rgba(5,8,14,0));font-weight:600;font-size:clamp(13px,3.4vw,16px);line-height:1.3;min-height:70px;display:flex;align-items:flex-end}
.cap .cs-a::before,.cap .cs-b::before{content:"";display:inline-block;width:9px;height:9px;margin-right:9px;vertical-align:baseline;background:var(--red)}
.cap .cs-b::before{background:var(--blue)}
.jcs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;font-weight:700}
.jc{padding:3px 10px;background:var(--surface2);font-family:var(--font-d);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.logd{border:1px solid var(--line);background:var(--surface)}
.logd summary{padding:10px 14px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.logd .log{border:0;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.fig .bob,.hpw.low .hpf{animation:none}.hpw .trail,.hpw .hpf,.fig{transition:none}}
/* shop */
.pack{display:grid;grid-template-columns:104px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);padding:14px}
.pack-art{aspect-ratio:3/4;display:grid;place-items:center;text-align:center;color:#fff;font-family:var(--font-d);font-weight:900;font-size:26px;line-height:.95;letter-spacing:.04em;text-transform:uppercase;padding:8px;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px),var(--pk)}
.pack-art small{display:block;font-family:var(--font-b);font-size:11px;font-weight:700;letter-spacing:.1em;margin-top:6px;opacity:.9}
.pack h3{font-size:26px}
.pack ul{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;font-weight:600}
.pack ul b{font-variant-numeric:tabular-nums}
.pack ul .r0 b{color:var(--r0)}.pack ul .r1 b{color:var(--r1)}.pack ul .r2 b{color:var(--r2)}.pack ul .r3 b{color:var(--r3)}
.price{display:inline-flex;align-items:center;gap:6px}
.price svg{width:18px;height:18px}

/* modal */
#modal{position:fixed;inset:0;z-index:60;display:none}
#modal.on{display:block}
.mk{position:absolute;inset:0;background:rgba(5,8,14,.7)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--red)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:620px;max-height:90%;border:1px solid var(--line);border-top:3px solid var(--red)}}
.det{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:16px;align-items:start}
@media (max-width:480px){.det{grid-template-columns:1fr}.det .card{max-width:230px;margin:0 auto}}
.stat-l{display:flex;flex-direction:column;gap:8px}
.stat-l div{display:grid;grid-template-columns:38px 1fr 28px;gap:8px;align-items:center;font-size:13px;font-weight:700;letter-spacing:.06em}
.stat-l .bar{min-width:0}
.stat-l b{font-family:var(--font-d);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots button{min-width:44px;min-height:40px;border:1px solid var(--line);background:var(--card);font-family:var(--font-d);font-weight:800;font-size:18px}
.slots button.on{background:var(--red);color:#fff;border-color:var(--red)}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.flip{background:none;border:0;padding:0;perspective:900px;display:block;width:100%}
.flip-in{position:relative;width:100%;aspect-ratio:3/4.15;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-f{transform:rotateY(180deg)}
.flip-b{display:grid;place-items:center;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 6px,transparent 6px 12px),var(--blue);color:#fff;font-family:var(--font-d);font-weight:900;font-size:56px;
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
.flip-b svg{width:48%;fill:none;stroke:#fff;stroke-width:3}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}.card.r3 .card-in::after{animation:none}.hp i{transition:none}}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:10px 18px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
/* arène, ceinture, ligue */
.nav button .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;letter-spacing:0;border-radius:8px}
.belt{display:block;width:100%;max-width:360px;margin:0 auto}
.beltbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px 16px}
.beltbox h3{font-size:32px}
.big-result .belt{max-width:300px}
.rv{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line)}
.rv .mini-t b{font-size:22px}
.rv .mini-t span{text-transform:none;letter-spacing:0}
.divbox{display:flex;flex-direction:column;gap:10px}
.div-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.field{display:block;width:100%;min-height:44px;padding:10px 12px;background:var(--surface);color:var(--fg);border:1px solid var(--line);font:inherit}
textarea.field{min-height:84px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.msg{margin:0;font-size:14px;font-weight:600}
.msg.err{color:var(--bad)}
.rowx{display:flex;gap:10px;flex-wrap:wrap}
.chip.gold{background:color-mix(in srgb,var(--gold) 28%,var(--surface2))}
.stage-name{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* ouverture de sacs : indices et mise en scène */
.flip{position:relative}
.flip:not(.on).h1{filter:drop-shadow(0 0 7px var(--r1))}
.flip:not(.on).h2{filter:drop-shadow(0 0 11px var(--r2))}
.flip:not(.on).h3{filter:drop-shadow(0 0 14px var(--r3));animation:hint 1.1s ease-in-out infinite alternate}
@keyframes hint{from{filter:drop-shadow(0 0 6px var(--r3))}to{filter:drop-shadow(0 0 18px var(--r3))}}
.spkhost{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
.spk{position:absolute;left:0;top:0;width:7px;height:7px;transform:translate(-50%,-50%);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.ringfx{position:absolute;left:50%;top:50%;width:60%;aspect-ratio:1;border:3px solid var(--r1);border-radius:50%;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;z-index:3;animation:ringx .8s ease-out}
@keyframes ringx{0%{transform:translate(-50%,-50%) scale(.3);opacity:.95}100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
.walk{position:fixed;inset:0;z-index:90;display:grid;place-items:center;overflow:hidden;opacity:0;transition:opacity .25s;--wc:var(--r2);cursor:pointer}
.walk.r3{--wc:var(--r3)}
.walk.in{opacity:1}
.w-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--wc) 38%,#05070c) 0,#05070c 72%)}
.w-rays{position:absolute;left:50%;top:45%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--wc) 55%,transparent) 0 6deg,transparent 6deg 18deg);opacity:0;animation:wspin 16s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 52%);mask-image:radial-gradient(circle,#000 0,transparent 52%)}
.walk.burst .w-rays{opacity:.8;transition:opacity .6s}
@keyframes wspin{to{transform:rotate(360deg)}}
.w-aura{position:absolute;left:50%;top:45%;width:62vmin;height:62vmin;margin:-31vmin 0 0 -31vmin;border-radius:50%;background:radial-gradient(circle,var(--wc),transparent 65%);opacity:.3;animation:waura .6s ease-in-out infinite alternate}
.walk.burst .w-aura{animation:none;opacity:.55;transform:scale(1.7);transition:transform .7s,opacity .7s}
@keyframes waura{from{transform:scale(.8);opacity:.2}to{transform:scale(1.15);opacity:.6}}
.w-card{position:relative;width:min(62vw,300px);aspect-ratio:3/4.15;perspective:1100px;transform:translateY(-3vh)}
.w-card>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .75s cubic-bezier(.2,.8,.2,1)}
.w-face{transform:rotateY(180deg)}
.walk.burst .w-back{transform:rotateY(-180deg)}
.walk.burst .w-face{transform:rotateY(0)}
.w-back{display:grid;place-items:center;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px),var(--blue);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.w-back svg{width:46%;fill:none;stroke:#fff;stroke-width:3}
.walk.charge .w-card{animation:wcharge .1s linear infinite}
@keyframes wcharge{0%{transform:translate(-4px,-3vh) rotate(-1.2deg)}50%{transform:translate(4px,-3vh) rotate(1.2deg)}100%{transform:translate(-4px,-3vh) rotate(-1.2deg)}}
.walk.burst .w-card{animation:wpop .55s ease-out}
@keyframes wpop{0%{transform:translateY(-3vh) scale(.78)}60%{transform:translateY(-3vh) scale(1.12)}100%{transform:translateY(-3vh) scale(1)}}
.w-title{position:absolute;top:9%;left:0;right:0;text-align:center;font-family:var(--font-d);font-weight:900;font-size:clamp(40px,13vw,88px);letter-spacing:.12em;text-transform:uppercase;color:var(--wc);text-shadow:0 0 26px var(--wc);opacity:0;transform:scale(.6)}
.walk.burst .w-title{opacity:1;transform:scale(1);transition:opacity .5s .1s,transform .5s cubic-bezier(.2,1.4,.3,1) .1s}
.w-sub{position:absolute;bottom:19%;left:0;right:0;text-align:center;font-family:var(--font-d);font-weight:800;font-size:clamp(24px,7vw,34px);letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:0}
.walk.burst .w-sub{opacity:1;transition:opacity .4s .5s}
.w-tap{position:absolute;bottom:8%;left:0;right:0;text-align:center;color:#cbd3e1;font-size:14px;letter-spacing:.1em;text-transform:uppercase;opacity:0}
.walk.ready .w-tap{opacity:.9;transition:opacity .4s;animation:wblink 1.4s ease-in-out infinite}
@keyframes wblink{50%{opacity:.4}}
.w-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.walk.burst .w-flash{animation:wflash .7s ease-out}
@keyframes wflash{0%{opacity:.95}100%{opacity:0}}
.w-parts{position:absolute;left:50%;top:45%;width:0;height:0;pointer-events:none}
.w-parts .spk{width:10px;height:10px;background:var(--wc)}
.cft{position:absolute;top:-4vh;border-radius:1px;pointer-events:none}
.w-parts .cft{position:fixed}
/* combat : version cinéma */
.fb-r{display:flex;align-items:center;gap:6px}
.lstats{display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.ls{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.ls b{font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:0;line-height:1}
.ls .la{color:var(--red);text-align:left}.ls .lb{color:var(--blue);text-align:right}
.cam{position:absolute;inset:0;transform-origin:50% 55%}
.speed{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at var(--cx,50%) 42%,rgba(255,255,255,.6) 0 1.1deg,transparent 1.1deg 7deg);-webkit-mask-image:radial-gradient(circle at var(--cx,50%) 42%,transparent 0,transparent 13%,#000 62%);mask-image:radial-gradient(circle at var(--cx,50%) 42%,transparent 0,transparent 13%,#000 62%)}
.vig{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(circle at 50% 50%,transparent 38%,rgba(0,0,0,.8))}
.hit.big{width:30%}
.intro{position:absolute;inset:0;z-index:9;overflow:hidden;background:#05070c}
.intro.out{opacity:0;transition:opacity .35s}
.in-bg-a,.in-bg-b{position:absolute;inset:0}
.in-bg-a{background:linear-gradient(120deg,color-mix(in srgb,var(--red) 80%,#000),#05070c 85%);clip-path:polygon(0 0,57% 0,43% 100%,0 100%);animation:inl .45s ease-out both}
.in-bg-b{background:linear-gradient(240deg,color-mix(in srgb,var(--blue) 80%,#000),#05070c 85%);clip-path:polygon(57% 0,100% 0,100% 100%,43% 100%);animation:inr .45s ease-out both}
@keyframes inl{from{transform:translateX(-100%)}to{transform:none}}
@keyframes inr{from{transform:translateX(100%)}to{transform:none}}
.in-a,.in-b{position:absolute;bottom:0;width:46%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.in-a{left:0;animation:inl .55s .1s ease-out both}.in-b{right:0;animation:inr .55s .1s ease-out both}
.in-av{width:88%;max-width:210px}.in-av svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.in-b .in-av svg{transform:scaleX(-1)}
.in-t{text-align:center;padding:2px 6px 14px;color:#fff;max-width:100%}
.in-t b{display:block;font-family:var(--font-d);font-weight:900;font-size:clamp(20px,6.2vw,36px);letter-spacing:.04em;text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.in-t span{font-size:clamp(10px,2.8vw,13px);font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.in-vs{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--font-d);font-weight:900;font-size:clamp(44px,13vw,80px);color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5);animation:invs .5s .35s cubic-bezier(.2,1.5,.3,1) both}
@keyframes invs{from{transform:translate(-50%,-50%) scale(3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.in-lab{position:absolute;left:0;right:0;top:8px;text-align:center;font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#cbd3e1}
.jc{opacity:0;animation:jin .4s ease forwards;animation-delay:calc(var(--i,0) * .45s + .2s)}
@keyframes jin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro *,.jc,.in-bg-a,.in-bg-b{animation:none!important}.jc{opacity:1}.walk .w-aura,.walk .w-rays,.flip:not(.on).h3{animation:none}}
/* Hall of Fame + évolutions */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes holo{to{--ang:360deg}}
.card.r4{--rc:var(--r4);background:conic-gradient(from var(--ang),#ff4d7e,#ffd96b,#59e0ff,#b58cff,#ff4d7e);animation:holo 6s linear infinite}
.card.r4 .card-in::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.3) 45%,rgba(120,220,255,.22) 55%,transparent 70%);background-size:250% 100%;animation:foil 4s linear infinite;pointer-events:none}
.ovr.r4,.pack ul .r4 b{color:var(--r4)}
.flip:not(.on).h4{filter:drop-shadow(0 0 16px var(--r4));animation:hint4 .9s ease-in-out infinite alternate}
@keyframes hint4{from{filter:drop-shadow(0 0 6px #ff4d7e)}to{filter:drop-shadow(0 0 22px #59e0ff)}}
.walk.r4{--wc:var(--r4)}
.c-evo{position:absolute;left:7.5cqw;top:30cqw;font-size:max(9px,5.4cqw);letter-spacing:.12em;color:#f2b630;text-shadow:0 0 6px rgba(242,182,48,.6)}
.card.e1 .card-in{box-shadow:inset 0 0 12px rgba(242,182,48,.28)}
.card.e2 .card-in{box-shadow:inset 0 0 20px rgba(242,182,48,.45)}
.card.e3 .card-in{box-shadow:inset 0 0 26px rgba(242,182,48,.6);animation:evop 2.2s ease-in-out infinite alternate}
@keyframes evop{from{box-shadow:inset 0 0 16px rgba(242,182,48,.4)}to{box-shadow:inset 0 0 34px rgba(255,120,80,.7)}}
.card.e2:not(.r3):not(.r4) .card-in::after,.card.e3:not(.r3):not(.r4) .card-in::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,236,170,.22) 50%,transparent 65%);background-size:250% 100%;animation:foil 5s linear infinite;pointer-events:none}
.evo{display:flex;align-items:center;gap:12px;justify-content:space-between}
.evo p{margin:4px 0 0;font-size:13px}
.evo-prev{width:64px;height:64px;flex:none;border-radius:12px;background:var(--surface2);overflow:hidden}
.evo-prev svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:reduce){.card.r4,.card.e3 .card-in,.flip:not(.on).h4,.card.r4 .card-in::after{animation:none}}
/* v7 : arènes animées, effets de combat, vues */
.cf{opacity:0;animation:cfl 2.7s infinite}
@keyframes cfl{0%,90%,100%{opacity:0}93%{opacity:1}96%{opacity:.15}}
.stage.frenzy .cf{animation-duration:.55s}
.bm{transform-box:fill-box;transform-origin:50% 0;animation:sweep 5.5s ease-in-out infinite alternate}
.b2{animation-delay:-2.7s;animation-direction:alternate-reverse}
@keyframes sweep{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.ember{opacity:0;animation:emb 4s linear infinite}
@keyframes emb{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-34px)}}
.lava{animation:lv 1.8s ease-in-out infinite alternate}
@keyframes lv{from{opacity:.45}to{opacity:1}}
.pulse{animation:pls 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pls{from{transform:scale(.85);opacity:.25}to{transform:scale(1.15);opacity:.5}}
.scan{animation:scn 3.2s linear infinite}
@keyframes scn{from{transform:translateY(0)}to{transform:translateY(58px)}}
.lamp{animation:swing 3.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.twk{animation:twk 2.4s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.2}to{opacity:1}}
.blink{animation:blk 1.4s steps(2) infinite}
@keyframes blk{50%{opacity:.12}}
.fig::after{content:"";position:absolute;left:14%;right:14%;bottom:-1%;height:7%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);z-index:-1}
.stage.hs{filter:contrast(1.18) saturate(1.3)}
.stage.hs .bob{animation-play-state:paused}
.imp{position:absolute;z-index:6;width:30%;aspect-ratio:1;display:grid;place-items:center;background:#ffe36b;clip-path:polygon(50% 0,60% 22%,84% 8%,78% 34%,100% 40%,80% 56%,96% 78%,70% 72%,64% 100%,50% 80%,36% 100%,30% 72%,4% 78%,20% 56%,0 40%,22% 34%,16% 8%,40% 22%)}
.imp.big{width:38%}
.imp span{font-family:var(--font-d);font-weight:900;font-size:clamp(14px,4.4vw,26px);color:#c4231a;transform:rotate(-6deg)}
.shock{position:absolute;width:60%;aspect-ratio:3.2;border:3px solid rgba(255,255,255,.75);border-radius:50%;transform:translate(-50%,-50%)}

<script>
/* ===== Simulation de combat (pur, sans DOM) ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var BEATS={LUT:'FRP',FRP:'SOU',SOU:'LUT'};
function matchup(s,o){return BEATS[s]===o?1.08:(BEATS[o]===s?0.93:1)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function pick(arr,rand){return arr[Math.floor(rand()*arr.length)]}
function fmtTime(s){s=Math.max(1,s);var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x}
var TXT={
 strike:['{a} enchaîne jab-direct et touche {d}','{a} claque un low kick appuyé sur {d}','{a} place un crochet du gauche sur {d}','{a} envoie un high kick, {d} encaisse','{a} cueille {d} d\'un uppercut','{a} gagne l\'échange au centre de l\'octogone','{a} fait reculer {d} avec une série de directs','{a} casse la garde de {d} d\'un coup de genou'],
 td:['{a} change de niveau et amène {d} au sol','{a} termine une double jambe sur {d}','{a} projette {d} sur le tapis','{a} colle {d} au grillage puis le fait chuter'],
 ctl:['{a} passe en garde latérale et contrôle {d}','{a} s\'installe en position montée','{a} travaille du pilonnage depuis le contrôle','{a} immobilise {d} au sol, sans lui laisser d\'espace'],
 near:['{a} cherche l\'étranglement, {d} défend de justesse','Clé de bras serrée par {a} ! {d} tient bon','{a} attrape un triangle, {d} s\'extirpe','{a} verrouille le dos de {d}, mais le placement lui échappe'],
 sub:['{d} tape ! Soumission de {a}','Étranglement arrière : {d} s\'endort, {a} gagne par soumission','Clé de bras finalisée, {d} tape forcément'],
 ko:['{a} met {d} KO d\'un crochet foudroyant !','{d} s\'écroule, {a} vient de le cueillir !','Coup de genou dévastateur, {d} est KO !'],
 tko:['L\'arbitre arrête le combat : {d} ne se défend plus','{a} submerge {d} de coups, victoire par arrêt de l\'arbitre']
};
function line(key,a,d,rand){return pick(TXT[key],rand).replace('{a}',a).replace('{d}',d)}
function simBout(A,B,rand){
 var F={a:A,b:B}, hp={a:100,b:100}, log=[], end=null, rounds=[];
 var o=function(k){return k==='a'?'b':'a'};
 var snap=function(){return{a:Math.max(0,Math.round(hp.a)),b:Math.max(0,Math.round(hp.b))}};
 for(var r=1;r<=3&&!end;r++){
  (function(r){
   var fat=function(k){return 1-(r-1)*(1-F[k].st.ca/100)*0.3};
   var mult={a:matchup(A.style,B.style),b:matchup(B.style,A.style)};
   var eff=function(k,s){return F[k].st[s]*fat(k)*mult[k]};
   var rd={dmg:{a:0,b:0},ctl:{a:0,b:0}};
   log.push({k:'round',r:r,text:'Round '+r,hp:snap()});
   for(var p=0;p<5&&!end;p++){
    var t=Math.floor(((p+0.5)/5)*300+(rand()*30-15));
    var lu={a:eff('a','lu'),b:eff('b','lu')};
    var g=0.2+0.35*Math.max(lu.a,lu.b)/100-0.15*Math.min(lu.a,lu.b)/100;
    if(rand()<g){
     var c=rand()<lu.a/(lu.a+lu.b)?'a':'b', d=o(c);
     rd.ctl[c]+=1;
     var so=eff(c,'so'), def=eff(d,'so');
     var gnp=eff(c,'fr')*(0.25+0.5*rand())/12*(1.3-F[d].st.me/200);
     hp[d]-=gnp; rd.dmg[c]+=gnp;
     var sp=clamp((so-def*0.75)/260+0.012,0.006,0.16);
     var x=rand();
     log.push({k:'td',t:t,r:r,text:line('td',F[c].last,F[d].last,rand),hp:snap(),side:c});
     if(x<sp){end={by:c,method:'SOU',r:r,t:t};log.push({k:'end',t:t,r:r,text:line('sub',F[c].last,F[d].last,rand),hp:snap(),side:c})}
     else if(x<sp*3) log.push({k:'near',t:t,r:r,text:line('near',F[c].last,F[d].last,rand),hp:snap(),side:c});
     else log.push({k:'ctl',t:t,r:r,text:line('ctl',F[c].last,F[d].last,rand),hp:snap(),side:c});
    } else {
     var ha=eff('a','fr')*(0.35+0.65*rand()), hb=eff('b','fr')*(0.35+0.65*rand());
     var da=ha/9*(1.3-F.b.st.me/200), db=hb/9*(1.3-F.a.st.me/200);
     hp.b-=da; hp.a-=db; rd.dmg.a+=da; rd.dmg.b+=db;
     var w=ha>=hb?'a':'b', l=o(w), h=w==='a'?ha:hb;
     var ch=clamp((h-52)/700+(1-hp[l]/100)*0.1,0,0.12)*(1.3-F[l].st.me/100);
     log.push({k:'strike',t:t,r:r,text:line('strike',F[w].last,F[l].last,rand),hp:snap(),side:w});
     if(rand()<ch){end={by:w,method:'KO',r:r,t:t};log.push({k:'end',t:t,r:r,text:line('ko',F[w].last,F[l].last,rand),hp:snap(),side:w})}
    }
    if(!end){
     if(hp.a<=0||hp.b<=0){
      var lo=hp.a<=0?'a':'b', wi=o(lo);
      end={by:wi,method:'KO',r:r,t:t,tko:true};
      log.push({k:'end',t:t,r:r,text:line('tko',F[wi].last,F[lo].last,rand),hp:snap(),side:wi});
     }
    }
   }
   rounds.push(rd);
   if(!end&&r<3){hp.a=Math.min(100,hp.a+7);hp.b=Math.min(100,hp.b+7)}
  })(r);
 }
 if(end) return {winner:end.by,method:end.method,tko:!!end.tko,r:end.r,t:end.t,log:log,judges:null,hp:snap()};
 var cards=[],wins={a:0,b:0};
 for(var j=0;j<3;j++){
  var ra=0,rb=0;
  rounds.forEach(function(rd){
   var diff=(rd.dmg.a+rd.ctl.a*2.5)-(rd.dmg.b+rd.ctl.b*2.5)+(rand()-0.5)*5;
   if(diff>=0)ra++;else rb++;
  });
  cards.push(ra>rb?{a:30-(3-ra)*1+ (ra===3?0:0),b:0,w:'a'}:{a:0,b:0,w:'b'});
  var sa=ra*10+rb*9, sb=rb*10+ra*9;
  cards[j]={a:sa,b:sb,w:sa>sb?'a':'b'};
  wins[cards[j].w]++;
 }
 var winner=wins.a>wins.b?'a':'b';
 var uni=(wins.a===3||wins.b===3);
 log.push({k:'end',t:300,r:3,text:'Les juges rendent leur verdict',hp:snap(),side:winner});
 return {winner:winner,method:'DEC',unanimous:uni,r:3,t:300,log:log,judges:cards,hp:snap()};
}

(function(){

 var st={}; st[order[0]]=base+8+j(); st[order[1]]=base-3+j(); st[order[2]]=base-9+j();

   var c=divChamp(i),l=c.team[4];openFight({mode:'title',div:i,divCls:dv[0],title:'Ceinture '+dv[0],sub:'vs '+l.first+' '+l.last+' · +3 aux combattants '+dv[0],theme:DIV_THEME[i],opp:c.team,label:'Titre '+dv[0]})})();break;
  case 'bpurse':(function(){var n=beltCount();if(!n||S.bpurse===today())return;S.bpurse=today();S.coins+=n*40;save();render();toast('Primes de ceintures : +'+(n*40)+' pièces')})();break;
  case 'svcopy':(function(){var ta=document.getElementById('svcode');if(!ta)return;ta.focus();ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('Code copié')},function(){toast('Sélectionne le code et copie-le')})}catch(e){toast('Sélectionne le code et copie-le')}})();break;
  case 'svimport':(function(){var ta=document.getElementById('svin'),msg=document.getElementById('svmsg'),v=ta?String(ta.value).trim():'',o=parseSave(v);
   if(!o){if(msg){msg.className='msg err';msg.textContent='Code invalide. Colle un code complet qui commence par CMS1.'}ui.impCode=null;return}
   if(ui.impCode!==v){ui.impCode=v;if(msg){msg.className='msg';msg.textContent='Code valide : '+Object.keys(o.owned).length+' cartes, '+fmt(o.coins)+' pièces. Appuie encore pour remplacer ta partie actuelle.'}el.textContent='Confirmer : remplacer ma partie';return}
   S=o;save();ui.impCode=null;ui.view='camp';closeModal();render();toast('Sauvegarde importée')})();break;
  case 'opts':ui.resetArm=false;openOpts();break;
  case 'mute':S.mute=!S.mute;save();if(!ui.fight)openOpts();if(!S.mute)sfx('tap');if(ui.fight&&ui.fight.stage==='bout')render();break;
  case 'reset':
   if(!ui.resetArm){ui.resetArm=true;openOpts()}
   else{S=normalise(fresh());save();ui.resetArm=false;ui.view='camp';closeModal();render();toast('Nouvelle partie')}
   break;
  case 'close':closeModal();if(ui.fight&&ui.fight.stage==='prep')renderPrep();else render();break;
 }
});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='pname'){S.name=(e.target.value||'Manager').replace(/[^\wÀ-ÿ \-]/g,'').slice(0,16)||'Manager';save();render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){closeModal();render()}});
render();
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
